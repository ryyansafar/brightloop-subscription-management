<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brightloop Subscription Management — UI Preview Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: #4f46e5;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid transparent;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .nav-btn:hover {
      background: #475569;
      color: #fff;
    }
    .nav-btn.active {
      background: #4f46e5;
      color: #fff;
      border-color: #6366f1;
    }
    .viewer-container {
      flex: 1;
      display: flex;
      position: relative;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      background: #ffffff;
    }
    .open-external {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
      text-decoration: none;
      padding: 6px 10px;
      border: 1px solid #334155;
      border-radius: 6px;
    }
    .open-external:hover {
      color: #fff;
      border-color: #475569;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <h1>Brightloop Subscription Management</h1>
      <span class="badge">STITCH UI</span>
    </div>
    <nav id="nav">
      <button class="nav-btn active" onclick="loadScreen('1_dashboard.html', this)">1. Dashboard</button>
      <button class="nav-btn" onclick="loadScreen('2_subscription_detail.html', this)">2. Subscriptions</button>
      <button class="nav-btn" onclick="loadScreen('3_billing_invoices.html', this)">3. Billing & Invoices</button>
      <button class="nav-btn" onclick="loadScreen('4_products_plans_discounts.html', this)">4. Products & Plans</button>
      <button class="nav-btn" onclick="loadScreen('5_quotation_templates.html', this)">5. Quotation Templates</button>
      <button class="nav-btn" onclick="loadScreen('6_customer_portal.html', this)">6. Customer Portal</button>
    </nav>
    <div>
      <a id="externalLink" href="1_dashboard.html" target="_blank" class="open-external">
        ↗ Open Screen in New Tab
      </a>
    </div>
  </header>
  <div class="viewer-container">
    <iframe id="screenFrame" src="1_dashboard.html"></iframe>
  </div>

  <script>
    function loadScreen(file, btn) {
      document.getElementById('screenFrame').src = file;
      document.getElementById('externalLink').href = file;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    // Sync if links inside the iframe navigate
    window.addEventListener('message', function(e) {
      if (e.data && e.data.screen) {
        const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick').includes(e.data.screen));
        if (btn) {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('externalLink').href = e.data.screen;
        }
      }
    });
  </script>
</body>
</html>
